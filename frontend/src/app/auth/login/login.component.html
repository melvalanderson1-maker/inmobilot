<div class="login-page">

  <!-- ===================================================
       FONDO
  ==================================================== -->
  <div class="fondo">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="grid-tecnico"></div>
    <div class="vignette"></div>
  </div>

  <!-- ===================================================
       ÓRBITAS DE ICONOS
  ==================================================== -->
  <div class="orbitas">
    <div class="orbita orbita-exterior">
      <div class="icono-flotante pos-left">
        <div class="icono-caja">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>
        </div>
        <span class="etiqueta">Contratos</span>
      </div>
      <div class="icono-flotante pos-right">
        <div class="icono-caja">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v13h6v-6h6v6h6V7z"></path></svg>
        </div>
        <span class="etiqueta">Lotes</span>
      </div>
      <div class="icono-flotante pos-top">
        <div class="icono-caja">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"></rect><line x1="8" y1="6" x2="10" y2="6"></line><line x1="14" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="10" y2="10"></line><line x1="14" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="10" y2="14"></line><line x1="14" y1="14" x2="16" y2="14"></line></svg>
        </div>
        <span class="etiqueta">Proyectos</span>
      </div>
      <div class="icono-flotante pos-bottom">
        <div class="icono-caja">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <span class="etiqueta">CRM</span>
      </div>
    </div>

    <div class="orbita orbita-interior">
      <div class="icono-flotante icono-chico pos-left">
        <div class="icono-caja">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        </div>
      </div>
      <div class="icono-flotante icono-chico pos-right">
        <div class="icono-caja">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </div>
      </div>
      <div class="icono-flotante icono-chico pos-top">
        <div class="icono-caja">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>
      <div class="icono-flotante icono-chico pos-bottom">
        <div class="icono-caja">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================================================
       CONTENIDO PRINCIPAL
  ==================================================== -->
  <main class="contenido-login">
    <div class="login-wrapper">

      <!-- LOGO -->
      <div class="logo-zona">
        <div class="logo-aura"></div>
        <div class="logo-caja">
          <div class="logo-badge">IL</div>
        </div>
        <h1 class="marca">Inmobilot</h1>
        <div class="marca-linea">
          <span class="linea"></span>
          <p class="submarca">Gestión de lotes &amp; CRM</p>
          <span class="linea"></span>
        </div>
      </div>

      <!-- CARD -->
      <div class="card-zona">
        <div class="card-glow"></div>

        <form class="login-card" (ngSubmit)="submit()">
          <div class="linea-superior"></div>

          <div class="card-header">
            <div class="header-top">
              <div class="icono-seguro">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </div>
              <span class="header-tag">Acceso seguro</span>
            </div>
            <h2 class="header-titulo">Bienvenido nuevamente</h2>
            <p class="header-subtitulo">Ingresa tus credenciales para acceder a la plataforma.</p>
          </div>

          @if (error()) {
            <div class="alerta-error">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              <p>{{ error() }}</p>
            </div>
          }

          <label class="campo">
            <span class="campo-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"></path><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6Z"></path><path d="m22 6-10 7L2 6"></path></svg>
              Correo electrónico
            </span>
            <div class="input-envoltorio">
              <svg class="input-icono" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6Z"></path><path d="m22 6-10 7L2 6"></path></svg>
              <input
                type="email"
                name="correo"
                [(ngModel)]="correo"
                placeholder="admin@inmobilot.com"
                autocomplete="email"
              />
            </div>
          </label>

          <label class="campo">
            <span class="campo-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              Contraseña
            </span>
            <div class="input-envoltorio">
              <svg class="input-icono" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input
                [type]="mostrarPassword() ? 'text' : 'password'"
                name="password"
                [(ngModel)]="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="btn-ojo" (click)="toggleMostrarPassword()" [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                @if (mostrarPassword()) {
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                } @else {
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                }
              </button>
            </div>
          </label>

          <button type="submit" class="btn-ingresar" [disabled]="cargando()">
            <span class="btn-brillo"></span>
            @if (cargando()) {
              <svg class="icono-spin" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
              <span>Ingresando...</span>
            } @else {
              <span>Ingresar a Inmobilot</span>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            }
          </button>

          <div class="pie-seguridad">
            <span class="punto-verde"></span>
            <span>Sistema protegido · Grupo RPC / Grupo Ecolimp</span>
          </div>
        </form>
      </div>

      <p class="pie-final">Gestión inteligente de lotes, contratos y clientes</p>
    </div>
  </main>
</div>
