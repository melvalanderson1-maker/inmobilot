<div class="form-page">
  <div class="hero">
    <div class="hero-text">
      <h1>Configuración legal</h1>
      <p>Estos datos se usan para generar automáticamente la Minuta y el Contrato Preparatorio.</p>
    </div>
  </div>

  @if (cargando()) {
    <div class="estado-carga"><span class="spinner"></span> Cargando...</div>
  } @else {
    <div class="layout">
      <div class="col-main">
        <section class="card">
          <h3>Datos de la empresa</h3>
          <div class="form-grid">
            <div class="campo">
              <label>RUC</label>
              <input type="text" [(ngModel)]="form.ruc" />
            </div>
            <div class="campo">
              <label>Representante legal</label>
              <input type="text" [(ngModel)]="form.representante_legal_nombre" />
            </div>
            <div class="campo">
              <label>DNI del representante</label>
              <input type="text" [(ngModel)]="form.representante_legal_dni" />
            </div>
            <div class="campo">
              <label>Estado civil del representante</label>
              <input type="text" [(ngModel)]="form.representante_legal_estado_civil" placeholder="SOLTERO" />
            </div>
            <div class="campo">
              <label>Partida de poderes</label>
              <input type="text" [(ngModel)]="form.partida_poderes" />
            </div>
            <div class="campo">
              <label>Oficina registral</label>
              <input type="text" [(ngModel)]="form.oficina_registral" placeholder="SATIPO" />
            </div>
            <div class="campo campo-span-2">
              <label>Domicilio fiscal</label>
              <input type="text" [(ngModel)]="form.domicilio_fiscal" />
            </div>
            <div class="campo">
              <label>Cuenta bancaria</label>
              <input type="text" [(ngModel)]="form.cuenta_bancaria" />
            </div>
            <div class="campo">
              <label>Banco</label>
              <input type="text" [(ngModel)]="form.banco" placeholder="BCP" />
            </div>
            <div class="campo">
              <label>Ciudad de firma de contratos</label>
              <input type="text" [(ngModel)]="form.ciudad_firma_contratos" placeholder="SATIPO" />
            </div>
          </div>
        </section>

        <section class="card">
          <h3>Gerente general — datos para la minuta</h3>
          <div class="form-grid">
            <div class="campo">
              <label>Sexo del gerente</label>
              <select [(ngModel)]="form.representante_legal_genero">
                <option value="">Selecciona</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
              </select>
            </div>
            <div class="campo">
              <label>Ocupación</label>
              <input type="text" [(ngModel)]="form.representante_legal_ocupacion" placeholder="EMPRESARIO" />
            </div>
            <div class="campo campo-span-2">
              <label>Domicilio del gerente</label>
              <input type="text" [(ngModel)]="form.representante_legal_domicilio" placeholder="JR. JOSE OLAYA N° 994, HUANCAYO, JUNÍN" />
            </div>
          </div>
        </section>

        <section class="card">
          <h3>Apoderado(a)</h3>
          <div class="form-grid">
            <div class="campo campo-span-2">
              <label>Nombre completo</label>
              <input type="text" [(ngModel)]="form.apoderado_nombre" />
            </div>
            <div class="campo">
              <label>DNI</label>
              <input type="text" [(ngModel)]="form.apoderado_dni" />
            </div>
            <div class="campo">
              <label>Sexo</label>
              <select [(ngModel)]="form.apoderado_genero">
                <option value="">Selecciona</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
              </select>
            </div>
            <div class="campo">
              <label>Estado civil</label>
              <input type="text" [(ngModel)]="form.apoderado_estado_civil" placeholder="SOLTERA" />
            </div>
            <div class="campo">
              <label>Ocupación</label>
              <input type="text" [(ngModel)]="form.apoderado_ocupacion" placeholder="EMPRESARIA" />
            </div>
            <div class="campo">
              <label>Partida de poderes <em>(opcional)</em></label>
              <input type="text" [(ngModel)]="form.apoderado_partida_poderes" />
            </div>
            <div class="campo campo-span-2">
              <label>Domicilio</label>
              <input type="text" [(ngModel)]="form.apoderado_domicilio" placeholder="AV. MÁRTIRES DE TSIRIARI N° 370, MAZAMARI, SATIPO, JUNÍN" />
            </div>
          </div>
        </section>
      </div>
      <aside class="col-side">
        <div class="card card-resumen">
          <button class="btn btn-primary btn-block" (click)="guardar()" [disabled]="guardando()">
            {{ guardando() ? 'Guardando...' : 'Guardar configuración' }}
          </button>
        </div>
      </aside>
    </div>
  }
</div>
